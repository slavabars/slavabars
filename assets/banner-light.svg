<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Вячеслав Барсуков — AI-first руководитель и архитектор IT-решений</title>
  <desc id="desc">Баннер профиля: монограмма ВБ, имя, специализация и ключевые метрики.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F6F8FA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#1A7F37" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#1A7F37" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#D0D7DE" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)" opacity="0.35"/>
  <rect width="1200" height="320" rx="16" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="none" stroke="#D0D7DE"/>

  <!-- status line -->
  <rect x="64" y="80" width="6" height="6" fill="#1A7F37"/>
  <text x="82" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" letter-spacing="2.2" fill="#1A7F37">AI-FIRST ARCHITECT</text>

  <!-- monogram -->
  <style>
    .cursor { animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0.15 } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none } }
  </style>
  <text x="64" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="100" letter-spacing="-3" fill="#1F2328">ВБ</text>
  <rect class="cursor" x="200" y="146" width="11" height="66" rx="2" fill="#1A7F37"/>
  <text x="66" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" letter-spacing="3.4" fill="#59636E">SLAVABARS</text>

  <!-- divider -->
  <line x1="392" y1="128" x2="392" y2="254" stroke="#1A7F37" stroke-opacity="0.35"/>

  <!-- name -->
  <text x="432" y="177" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="600" letter-spacing="-0.5" fill="#1F2328">Вячеслав Барсуков</text>

  <!-- role -->
  <text x="434" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#59636E">AI-first руководитель и архитектор IT-решений</text>

  <!-- metrics -->
  <text x="434" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#59636E">
    <tspan fill="#1A7F37">15+</tspan><tspan> лет</tspan><tspan fill="#AFB8C1">  ·  </tspan><tspan fill="#1A7F37">300+</tspan><tspan> серверов</tspan><tspan fill="#AFB8C1">  ·  </tspan><tspan fill="#1A7F37">SLA 99.9%</tspan><tspan fill="#AFB8C1">  ·  </tspan><tspan fill="#1A7F37">10</tspan><tspan> CRM с нуля</tspan>
  </text>

  <!-- mesh motif -->
  <g stroke="#1A7F37" stroke-opacity="0.35" fill="none">
    <path d="M1012 78 L1076 58 L1144 86 L1120 132 L1046 126 Z"/>
    <path d="M1076 58 L1120 132" stroke-dasharray="4 5"/>
    <path d="M1012 78 L1120 132" stroke-dasharray="4 5"/>
  </g>
  <g fill="#1A7F37">
    <circle cx="1012" cy="78" r="3.5"/>
    <circle cx="1076" cy="58" r="2.5" fill-opacity="0.7"/>
    <circle cx="1144" cy="86" r="2.5" fill-opacity="0.7"/>
    <circle cx="1120" cy="132" r="3.5"/>
    <circle cx="1046" cy="126" r="2.5" fill-opacity="0.7"/>
  </g>

  <!-- pipeline -->
  <text x="1150" y="288" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#59636E" fill-opacity="0.65">spec → code → tests → deploy → observability</text>
</svg>
